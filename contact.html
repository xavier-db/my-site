<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Contact | Elysian: To Be Seen</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Elysian: To Be Seen</h1>

            <nav>
                <a class="siteRepo" href="/siteRepo/index.html">Home</a>
                <a class="siteRepo" href="/siteRepo/about.html">About</a>
                <a class="siteRepo" href="/siteRepo/staff.html">Staff's Work</a> 
                <a class="active siteRepo" href="/siteRepo/contact.html">Contact</a>
            </nav>
        </header>

        <main class="contact_main">
            <form class="contactForm" action="https://formsubmit.co/elysian.magazine.official@gmail.com" method="POST" enctype="multipart/form-data">
                <h2>Contact Us</h2>
                <p>
                    For collaboration, inquiries, or creative opportunities, feel free to send a message.
                </p>

                <input type="text" name="name" placeholder="Author's Name (will be displayed with your work)" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <textarea name="message" placeholder="Write your submission or message here"></textarea>
                <textarea name="trigger_warnings" placeholder="Trigger warnings to note (leave blank if none)"></textarea>

                <label class="permission-check">
                    <input type="checkbox" name="edit_permission" value="Yes, I give permission for edits" required>
                    I give Elysian permission to make edits to my work if needed (we'll always confirm any edits with you first)
                </label>

                <p style="font-weight: bold;">
                    Attach your work / images / audio files (10MB max file size)
                </p>

                <input type="file" name="attachment" multiple accept=".png, .jpeg, .jpg, .gif, .webp, .mp3, .wav, .ogg, .flac, .m4a, .pdf, .doc, .docx, .txt">
                <button type="submit">Send Message</button>

                <input type="hidden" name="_next" value="https://xavier-db.github.io/my-site/thankyou.html">
            </form>
        </main>

        <footer>
            <span>&copy; 2026 Elysian: To Be Seen</span>
        </footer>
        
        <script src="script.js"></script>
    </body>
</html>
